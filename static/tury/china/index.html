(() => {

// у каждого тура свой адрес (…/china/, …/altai/, …/more/, …/online/) — отдельная страница; переключение без перезагрузки, «назад» работает

addEventListener('popstate', () => { const T = TOURS.find(x => location.pathname.endsWith('/' + x.slug + '/')); if (T) go(T.key); });
go(window.START || 'china');
// остальные туры подгружаем заранее
TOURS.forEach(T => pre(T.key));
})();
// осенние листья: крупные, кружатся и переворачиваются; ближние сильнее сдвигаются от мышки
(() => {
const fx = document.getElementById('fx'), c2 = fx.getContext('2d');
const fsz = () => { fx.width = innerWidth; fx.height = innerHeight; }; fsz(); addEventListener('resize', fsz);
const PI = [...Array(9)].map((_, k) => { const i = new Image(); i.src = `c/leaf${k}.webp`; return i; });
const P = Array.from({ length: 13 }, (_, k) => ({ x: Math.random(), y: Math.random(), z: .4 + Math.random() * .8, r: Math.random() * 6.3, f: Math.random() * 6.3, s: .4 + Math.random() * .6, i: k % 9 }));

  P.forEach(p => { p.y += .0008 * p.s * p.z; p.x += .0004 * p.z + Math.sin(p.y * 8 + p.r) * .0006; p.r += .008 * p.s; p.f += .03 * p.s;
    if (p.y > 1.08 || p.x > 1.02) { p.y = -.08; p.x = Math.random() * .9; }
    const im = PI[p.i]; if (!im.complete || !im.width) return;
    const x = p.x * W + mx * 50 * p.z, y = p.y * H + my * 32 * p.z, z = (34 + 40 * p.z) / Math.max(im.width, im.height);
    c2.save(); c2.translate(x, y); c2.rotate(p.r); c2.scale(z * Math.cos(p.f), z); c2.globalAlpha = .95;

    c2.drawImage(im, -im.width / 2, -im.height / 2); c2.restore(); });

// видео тура: превью на плашке ↔ телефон, переход «джинн»
(() => {
const phone = document.getElementById('phone'), vid = document.getElementById('vid'), fx = document.getElementById('gfx'), ctx = fx.getContext('2d');
const dpr = Math.min(2, devicePixelRatio || 1);
const size = () => { fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; fx.style.width = innerWidth + 'px'; fx.style.height = innerHeight + 'px'; };
size(); addEventListener('resize', size);
function snapshot(src) { const r = phone.getBoundingClientRect(), c = document.createElement('canvas'), k = 2; c.width = r.width * k; c.height = r.height * k; const g = c.getContext('2d'); g.scale(k, k);
  const rr = (x, y, w, h, rad) => { g.beginPath(); g.roundRect(x, y, w, h, rad); }; g.fillStyle = '#111'; rr(0, 0, r.width, r.height, 44); g.fill();
  g.save(); rr(10, 10, r.width - 20, r.height - 20, 34); g.clip(); const sw = src.videoWidth || src.naturalWidth || 9, sh = src.videoHeight || src.naturalHeight || 16, iw = r.width - 20, ih = r.height - 20;
  const s = Math.max(iw / sw, ih / sh); try { g.drawImage(src, 10 + (iw - sw * s) / 2, 10 + (ih - sh * s) / 2, sw * s, sh * s); } catch (e) {} g.restore(); return c; }

  const near = (S.left + S.width / 2) > (B.left + B.width / 2), lag = .55, cw = img.width / N, E = [];
  for (let i = 0; i <= N; i++) { const u = i / N, d = near ? u : 1 - u; const pp = ease(Math.min(1, Math.max(0, t * (1 + lag) - d * lag))), vv = ease(Math.min(1, Math.max(0, t * (1 + lag * .4) - d * lag * .4)));
    E.push([S.left + u * S.width + ((B.left + u * B.width) - (S.left + u * S.width)) * pp, S.top + (B.top - S.top) * vv, S.height + (B.height - S.height) * vv]); }
  ctx.globalAlpha = Math.min(1, t * 6); for (let i = 0; i < N; i++) { const [x, t1, h1] = E[i], [x2, t2, h2] = E[i + 1]; ctx.drawImage(img, i * cw, 0, cw, img.height, x, (t1 + t2) / 2, Math.max(.5, x2 - x) + .8, (h1 + h2) / 2); } ctx.globalAlpha = 1; }

// превью видео на сверстанной странице тура (в плашке): клик — не играть на месте, а «вылить» видео в телефон над сценой
function openFrom(el, src, posterUrl) {

function hook(doc, base) {

  doc.head.appendChild(st);

  doc.addEventListener('click', e => { const a = e.target.closest('a[href]'); if (!a) return;
    const m = new URL(a.getAttribute('href'), base).pathname.match(/\/(?:kanikuly|tury-d80292c3887a)\/(china|altai|more|online)\/?$/);   // и старые адреса туров, и новые
    if (m && window.__goTour && window.__goTour(m[1])) { e.preventDefault(); e.stopPropagation(); } }, true);
  doc.querySelectorAll('video[controls]').forEach(v => { if (v.closest('#lb')) return;   // окно-просмотрщик самой страницы не трогаем

      if (src) openFrom(w, src, abs(v.getAttribute('poster'))); });
  });
}
window.__hookPage = hook;
const close = () => { if (busy || phone.style.visibility !== 'visible') return; const img = snapshot(vid.readyState >= 2 ? vid : new Image()); vid.pause(); phone.style.visibility = 'hidden';
  const fr = document.getElementById('page').getBoundingClientRect(), el = from && from.el, r = el && el.isConnected ? el.getBoundingClientRect() : null;
  const S = r ? { left: fr.left + r.left, top: fr.top + r.top, width: r.width, height: r.height } : from; if (el) el.style.visibility = 'hidden';

document.querySelector('.icons').addEventListener('click', () => { if (phone.style.visibility === 'visible') { vid.pause(); phone.style.visibility = 'hidden'; } });
})();
